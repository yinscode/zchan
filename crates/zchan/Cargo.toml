[package]
name = "zchan"
description = "Unidirectional (Spilman) payment channels on Zcash v6: agent → solver → merchants"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
zchan-tx = { path = "../zchan-tx" }
pczt = { version = "=0.10.0-pre.1" }
orchard = { version = "=0.16.0" }
secp256k1 = { version = "0.33", features = ["alloc"] }
zcash_protocol = { version = "=0.11.0-pre.0", features = ["local-consensus"] }
zcash_transparent = { version = "=0.11.0-pre.1", features = ["transparent-inputs"] }
zcash_primitives = { version = "=0.31.0-pre.1", features = ["transparent-inputs"] }
zcash_script = { version = "0.6", default-features = false }
hex = "0.4"
sha2 = "0.10"
rand10 = { package = "rand", version = "0.10" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# QR checkout links.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
